version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/controlbuddy_studybuddy
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=controlbuddy-studybuddy-jwt-secret-2026
      - RUST_LOG=info
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: controlbuddy_studybuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.9
    environment:
      - MEILI_MASTER_KEY=controlbuddy_studybuddy_master_key_2026
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  meilidata:
