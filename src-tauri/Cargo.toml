[package]
name = "webbuddy"
version = "1.0.0"
description = "WebBuddy Browser - Next-Gen High-Speed Private Web Browser"
authors = ["WebBuddy Team"]
edition = "2021"

[lib]
name = "webbuddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.5"
