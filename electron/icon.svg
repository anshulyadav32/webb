<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background rounded squircle / macos app icon container -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726" />
      <stop offset="50%" stop-color="#0E111C" />
      <stop offset="100%" stop-color="#080A10" />
    </linearGradient>

    <!-- Primary Neon Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Deep Prism Gradient -->
    <linearGradient id="prismGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161F38" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="100%" stop-color="#2D124D" />
    </linearGradient>

    <!-- Orbital Energy Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="glowBlur" />
      <feMerge>
        <feMergeNode in="glowBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="45%" stop-color="#818CF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0E111C" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- macOS App Squircle Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="3"/>

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="256" r="190" fill="url(#coreGlow)" />

  <!-- Orbital Ring Behind -->
  <ellipse cx="256" cy="256" rx="210" ry="85" transform="rotate(-25 256 256)" 
           stroke="url(#ringGrad)" stroke-width="8" stroke-dasharray="24 16" opacity="0.65" />

  <!-- Geometric Hex Prism Base Shell -->
  <polygon points="256,64 430,158 430,354 256,448 82,354 82,158" 
           fill="url(#prismGrad)" stroke="url(#neonGrad)" stroke-width="10" stroke-linejoin="round" />

  <!-- Prism Facets Shading -->
  <polygon points="256,64 430,158 256,256" fill="#00F2FE" opacity="0.08" />
  <polygon points="82,158 256,64 256,256" fill="#818CF8" opacity="0.06" />
  <polygon points="256,448 430,354 256,256" fill="#C084FC" opacity="0.09" />
  <polygon points="82,354 256,448 256,256" fill="#38BDF8" opacity="0.06" />

  <!-- Glowing Geometric 'W' Prism Glyph -->
  <path d="M140 185 L196 360 L238 275 L202 195 Z" fill="url(#neonGrad)" opacity="0.85" />
  <path d="M372 185 L316 360 L274 275 L310 195 Z" fill="url(#neonGrad)" opacity="0.85" />
  <polygon points="256,180 282,275 256,252 230,275" fill="#00F2FE" filter="url(#glowFilter)" />

  <!-- Razor Crisp Vector Path Strokes -->
  <polyline points="140,185 196,360 256,245 316,360 372,185" 
            stroke="url(#neonGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)" />
  <polyline points="140,185 196,360 256,245 316,360 372,185" 
            stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Foreground Orbital Sweeping Arc -->
  <path d="M78 300 C130 380 370 410 435 245" 
        stroke="url(#neonGrad)" stroke-width="9" stroke-linecap="round" opacity="0.9" />
  <circle cx="435" cy="245" r="14" fill="#00F2FE" filter="url(#glowFilter)" />
  <circle cx="435" cy="245" r="7" fill="#FFFFFF" />

  <!-- Quantum Core Sparkle Node -->
  <circle cx="256" cy="135" r="11" fill="#FFFFFF" filter="url(#glowFilter)" />
  <path d="M256 95 V175 M216 135 H296" stroke="#00F2FE" stroke-width="8" stroke-linecap="round" />
</svg>
